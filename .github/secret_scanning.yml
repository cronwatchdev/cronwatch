# The redaction and channel tests need strings shaped like real tokens (AWS,
# GitHub, Slack, Stripe, Anthropic, Mailgun, Twilio, private keys) to prove
# they are blanked or sent. None is a credential: the AWS ones are Amazon's
# documented AKIAIOSFODNN7EXAMPLE and wJalrXUtnFEMI/K7MDENG+bPxRfiCYEXAMPLEKEY
# placeholders. Every port replays the same fixtures, so skip the files that
# hold them literally rather than dismiss each alert. Most ports build these
# strings from pieces at run time and need no entry; a test that writes one
# out whole is listed here by name, never by directory.
paths-ignore:
  - "conformance/**"
  - "scripts/conformance.mjs"
  - "deploy/contact/server.test.mjs"
  - "packages/sdk/test/channels.test.ts"
  - "packages/sdk/test/channels-hardening.test.ts"
  - "packages/sdk/test/redaction.test.ts"
  - "packages/sdk/test/sigv4.test.ts"
  - "packages/ruby/test/channels_hardening_test.rb"
  - "packages/ruby/test/provider_channels_test.rb"
  - "packages/ruby/test/rails/rails_test.rb"
  - "packages/python/tests/test_channels.py"
  - "packages/php/tests/ChannelsTest.php"
  - "packages/php/tests/Craft/CraftTest.php"
  - "packages/go/internal/output/redaction_test.go"
  - "packages/rust/cronwatch/src/output/tests.rs"
  - "packages/elixir/test/alerts/hardening_test.exs"
  - "packages/elixir/test/audit/core_test.exs"
  - "packages/elixir/test/audit/outbound_http_test.exs"
  - "packages/elixir/test/cronwatch/output_test.exs"
  - "packages/java/cronwatch/src/test/java/dev/cronwatch/alerts/ProvidersTest.java"
