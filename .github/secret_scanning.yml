# The redaction tests need strings shaped like real tokens (AWS, GitHub,
# Slack, Stripe, Anthropic) to prove they are blanked. None is a credential:
# the AWS ones are Amazon's documented AKIAIOSFODNN7EXAMPLE placeholder. Every
# port replays the same fixtures, so skip them rather than dismiss each alert.
paths-ignore:
  - "conformance/**"
  - "scripts/conformance.mjs"
  - "packages/*/test/**"
