# A release tag -> the Java build in packages/java published to Maven Central
# (dev.cronwatch:cronwatch, cronwatch-servlet, cronwatch-quartz,
# cronwatch-jobrunr, and cronwatch-spring-boot-starter). Maven Central has no
# trusted publishing (packages/java/DESIGN.md, Releasing), so this takes a
# Portal user token and a signing key from the environment's secrets; when
# Central ships it, this moves to OIDC and the token is revoked. Can also be
# started by hand for a tag. The first release is published by hand; this is
# for the ones after.
#
# Three jobs. "ci" waits for CI to pass on the tagged commit (ci-passed.yml).
# "build" resolves the dependencies, runs the tests, and builds the jars, the
# sources and javadoc jars, and the flattened POMs with the release profile,
# with no credential, and uploads them, laid out as Central's bundle with
# their checksums, as the artifact "maven-bundle". "publish" holds the token
# and the key and runs no build and no dependency's code: it signs each file
# with gpg, zips the bundle, and uploads it to the Central Publisher Portal's
# API with curl, which publishes it once it has validated it.
#
# Stays off until the repository variable MAVEN_ENABLED is "true". Before
# that, here: create the environment "maven" (Settings, Environments) with
# required reviewers, since a release on Central cannot be taken back, and
# add to it, as environment secrets and never repository secrets:
#   CENTRAL_TOKEN_USERNAME and CENTRAL_TOKEN_PASSWORD: a user token generated
#     in the Central Publisher Portal (central.sonatype.com, View Account,
#     Generate User Token) for this workflow alone, by the account that holds
#     the verified namespace dev.cronwatch. The token is a pair, a name and
#     a password, and is revoked in the Portal.
#   MAVEN_GPG_PRIVATE_KEY: the armoured signing subkey alone, exported with
#     `gpg --armor --export-secret-subkeys <the subkey's id>!`, so the
#     primary key never leaves the owner's machine. Its public half must be
#     on keys.openpgp.org or keyserver.ubuntu.com, where Central looks for it.
#   MAVEN_GPG_PASSPHRASE: that key's passphrase.
# Then set the repository variable MAVEN_ENABLED to true.
#
# A run that fails before the upload can be started again. Central takes a
# version once: if a run fails after the upload, look at the deployment in
# the Portal before starting another, and drop a failed one there.
name: Maven Central

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish (v0.9.0, say)
        required: true

permissions:
  contents: read

concurrency:
  group: maven
  cancel-in-progress: false

jobs:
  # CI must pass on the tagged commit first (ci-passed.yml).
  ci:
    if: vars.MAVEN_ENABLED == 'true'
    uses: ./.github/workflows/ci-passed.yml
    permissions:
      actions: read
      contents: read
    with:
      tag: ${{ inputs.tag }}

  # Everything that resolves a dependency or runs a build, with no secret in
  # reach.
  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.ci.outputs.sha }}
          persist-credentials: false
      - name: Check the tag is the build's version
        working-directory: packages/java
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "not a release tag: $TAG"; exit 1 ;; esac
          # The build's version must be the tag's, or Central would list a
          # release the tag does not name.
          version="$(sed -n 's/^ *<revision>\(.*\)<\/revision>$/\1/p' pom.xml | head -1)"
          if [ "v$version" != "$TAG" ]; then echo "packages/java is $version, the tag is $TAG"; exit 1; fi
      # The newest entry ci.yml tests, the one whose javadoc it checks; the
      # bytecode is Java 21's whatever the JDK.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "27"
      # The tests (the database ones skip, as they say), then the release
      # profile's sources and javadoc jars, unsigned: signing is the publish
      # job's.
      - name: ./mvnw -P release verify
        working-directory: packages/java
        run: ./mvnw -B -P release -Dgpg.skip verify
      # Every module but webtest, webserver, and the example is published
      # (the release profile's excludeArtifacts; the parent is not either,
      # since the flattened POMs stand alone), each as its POM, its jar, and
      # its sources and javadoc jars, with the checksums Central asks for.
      - name: Lay out the bundle
        working-directory: packages/java
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ *<revision>\(.*\)<\/revision>$/\1/p' pom.xml | head -1)"
          published="cronwatch cronwatch-servlet cronwatch-quartz cronwatch-jobrunr cronwatch-spring-boot-starter"
          sed -n 's#^ *<module>\(.*\)</module>$#\1#p' pom.xml | while read -r module; do
            case " $published webtest webserver examples/crontab " in *" $module "*) ;; *) echo "the module $module is neither published nor left out here"; exit 1 ;; esac
          done
          bundle="$RUNNER_TEMP/bundle"
          for artifact in $published; do
            dir="$bundle/dev/cronwatch/$artifact/$version"
            mkdir -p "$dir"
            cp "$artifact/.flattened-pom.xml" "$dir/$artifact-$version.pom"
            for suffix in "" -sources -javadoc; do cp "$artifact/target/$artifact-$version$suffix.jar" "$dir/"; done
          done
          cd "$bundle"
          find dev -type f | sort | while read -r file; do
            md5sum < "$file" | cut -d' ' -f1 > "$file.md5"
            sha1sum < "$file" | cut -d' ' -f1 > "$file.sha1"
            sha256sum < "$file" | cut -d' ' -f1 > "$file.sha256"
            sha512sum < "$file" | cut -d' ' -f1 > "$file.sha512"
          done
          find dev -type f | sort
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-bundle
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error

  # Holds the token and the key, and runs only gpg, zip, and curl: the
  # deployment is published once the Portal has validated it, and the job
  # waits until it is, so a green run is a release on Central.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: maven
    permissions: {}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-bundle
          path: ${{ runner.temp }}/bundle
      - name: Check the bundle is the tag's
        run: |
          version="${TAG#v}"
          for artifact in cronwatch cronwatch-servlet cronwatch-quartz cronwatch-jobrunr cronwatch-spring-boot-starter; do
            test -f "$RUNNER_TEMP/bundle/dev/cronwatch/$artifact/$version/$artifact-$version.pom" || { echo "the bundle has no $artifact $version"; exit 1; }
          done
      # Into a GNUPGHOME of the job's own, removed when the job ends. Said
      # before anything is signed: a missing secret is an empty string, and
      # the key's fingerprint is in the log beside the release.
      - name: Import the signing key and check the token is there
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          for name in MAVEN_GPG_PRIVATE_KEY CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD MAVEN_GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then echo "the maven environment has no secret $name"; exit 1; fi
          done
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --with-subkey-fingerprint
          if ! gpg --list-secret-keys --with-colons | grep -q '^ssb:'; then
            echo "no signing subkey was imported: is MAVEN_GPG_PRIVATE_KEY set in the maven environment?"
            exit 1
          fi
      # A signature on every file but the checksums, which Central asks of
      # none of them.
      - name: Sign and zip the bundle
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          cd "$RUNNER_TEMP/bundle"
          find dev -type f ! -name '*.md5' ! -name '*.sha1' ! -name '*.sha256' ! -name '*.sha512' | sort | while read -r file; do
            printf '%s' "$MAVEN_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign --output "$file.asc" "$file"
            gpg --batch --verify "$file.asc" "$file" 2> /dev/null
          done
          zip -qr "$RUNNER_TEMP/central-bundle.zip" dev
          unzip -l "$RUNNER_TEMP/central-bundle.zip"
      # The Portal's publisher API: the upload answers the deployment's id,
      # and its status moves through VALIDATING and PUBLISHING to PUBLISHED,
      # or to FAILED with the reasons. The upload is sent once, never
      # retried, since Central takes a version once.
      - name: Upload to the Central Publisher Portal and wait until it is published
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          set -euo pipefail
          token="$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)"
          echo "::add-mask::$token"
          api=https://central.sonatype.com/api/v1/publisher
          id="$(curl -fsS -X POST -H "Authorization: Bearer $token" -F "bundle=@$RUNNER_TEMP/central-bundle.zip" \
            "$api/upload?name=cronwatch-${TAG#v}&publishingType=AUTOMATIC")"
          case "$id" in ''|*[!0-9a-f-]*) echo "the Portal did not answer a deployment id: $id"; exit 1 ;; esac
          echo "deployment $id"
          for _ in $(seq 1 150); do
            sleep 20
            status="$(curl -fsS --retry 5 --retry-all-errors -X POST -H "Authorization: Bearer $token" "$api/status?id=$id")"
            state="$(printf '%s' "$status" | jq -r .deploymentState)"
            echo "$state"
            case "$state" in
              PUBLISHED) exit 0 ;;
              FAILED) printf '%s\n' "$status" | jq .; exit 1 ;;
            esac
          done
          echo "deployment $id was not published within 50 minutes; see it in the Portal"
          exit 1
      - name: Remove the signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg"
