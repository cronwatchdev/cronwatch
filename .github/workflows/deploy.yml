# CI green on a push to main -> run the deploy script on the server over SSH.
#
# Waits for the CI workflow, so nothing reaches the server that failed the
# dash check, typecheck, tests or build (the server itself only builds the
# site). Can also be started by hand.
#
# Stays off until the repository variable DEPLOY_ENABLED is "true". Needs two
# repository secrets:
#   DEPLOY_SSH_KEY      private key whose public half is in ~joncphillips/.ssh/authorized_keys
#                       on the server, restricted there to running deploy/release-deploy only
#   DEPLOY_KNOWN_HOSTS  output of: ssh-keyscan -p 2222 cronwatch.dev
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# The job needs no token: it only reads secrets and talks SSH.
permissions: {}

# Never run two deploys at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run the deploy script on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p 2222 -o IdentitiesOnly=yes -o BatchMode=yes joncphillips@cronwatch.dev deploy
