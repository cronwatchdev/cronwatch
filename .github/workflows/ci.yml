# Every push and pull request: the dash check (files and commit messages),
# typecheck, tests, a build, and the packed packages used from a scratch
# project, on the two Node majors better-sqlite3 13 supports. The Ruby gem's
# tests run on the oldest and newest Ruby it supports, against each
# supported Rails series. The Python package's tests run on the oldest and
# newest Python it supports, against each supported Django series, and the
# PHP package's on the oldest and newest PHP, against MySQL, MariaDB,
# Postgres and WordPress, against each supported Laravel and Symfony
# series, and in a real Drupal and a real Craft. The Go module's tests run
# on the two Go releases Go supports, with the race detector, against
# SQLite, Postgres, MySQL and MariaDB. The Rust workspace's tests run on
# its rust-version (1.85, the core) and on stable (everything), with
# rustfmt and clippy. The MCP server is driven against each port's
# dashboard. One Node, one Ruby, one Python, one PHP and one Go entry also
# run the pg_cron tests against a Postgres with the extension, and the built
# site's links are checked.
# A green run on main is what lets deploy.yml ship the site.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: No em or en dashes in commit messages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            node scripts/check-dashes.mjs --commits "$BASE..$HEAD"
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # A new branch (before is all zeros) or a force push: the head commit only.
            node scripts/check-dashes.mjs --commits -1 "$AFTER"
          else
            node scripts/check-dashes.mjs --commits "$BEFORE..$AFTER"
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: cw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:dashes
      - run: npm run typecheck
      # A second Postgres with pg_cron, for the pg_cron source's tests against
      # the real extension. The stock image has the PGDG apt repository, so
      # the extension is installed before the server starts. The entrypoint's
      # setup server only listens on its socket, so a TCP query that sees
      # pg_cron preloaded means the real server is up (pg_isready would pass
      # during setup). The URL goes to $GITHUB_ENV for the steps after this.
      - name: Start Postgres with pg_cron
        if: matrix.node == 24
        run: |
          docker run -d --name pgcron -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=cw -p 5433:5432 postgres:16 \
            bash -c 'apt-get update -qq && apt-get install -y -qq postgresql-16-cron > /dev/null && exec docker-entrypoint.sh postgres -c shared_preload_libraries=pg_cron -c cron.database_name=cw'
          for _ in $(seq 1 90); do
            if [ "$(docker exec pgcron psql postgres://postgres:pw@127.0.0.1:5432/cw -tAc 'show shared_preload_libraries' 2>/dev/null)" = "pg_cron" ]; then
              echo "CRONWATCH_TEST_PGCRON=postgres://postgres:pw@127.0.0.1:5433/cw" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs pgcron
          exit 1
      - run: npm test
        env:
          CRONWATCH_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/cw
      - run: npm run build
      # Pack both packages, install the tarballs into a scratch project, then
      # import and require every entry, typecheck them (node16 ESM and CJS,
      # bundler) and run Are the Types Wrong.
      - run: npm run check:packages
      # Every internal link and #fragment in the built site resolves.
      - run: npm run build:site
      - run: node scripts/check-links.mjs site/dist

  # The gem's tests replay conformance/ and compare against the built SDK, so
  # the SDK is built (and the fixtures checked) first. Postgres store tests run against the service.
  # Each supported Rails series runs from its own Gemfile in
  # test/rails/gemfiles; setup-ruby's bundler-cache reads BUNDLE_GEMFILE
  # from the job's environment.
  ruby:
    name: ruby (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { ruby: "3.2", rails: "7.2", gemfile: rails_7_2 }
          - { ruby: "3.4", rails: "8.0", gemfile: rails_8_0 }
          - { ruby: "3.4", rails: "8.1", gemfile: rails_8_1 }
          - { ruby: "4.0", rails: "8.1", gemfile: rails_8_1 }
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/packages/ruby/test/rails/gemfiles/${{ matrix.gemfile }}.gemfile
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: cw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Builds the SDK, then fails if conformance/ or the dashboard fixture
      # (packages/ruby/test/web/golden.json) is stale.
      - run: npm run check:conformance
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: packages/ruby
      # A second Postgres with pg_cron, for the pg_cron source's tests against
      # the real extension. The stock image has the PGDG apt repository, so
      # the extension is installed before the server starts. The entrypoint's
      # setup server only listens on its socket, so a TCP query that sees
      # pg_cron preloaded means the real server is up (pg_isready would pass
      # during setup). The URL goes to $GITHUB_ENV for the steps after this.
      - name: Start Postgres with pg_cron
        if: matrix.ruby == '3.4' && matrix.rails == '8.1'
        run: |
          docker run -d --name pgcron -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=cw -p 5433:5432 postgres:16 \
            bash -c 'apt-get update -qq && apt-get install -y -qq postgresql-16-cron > /dev/null && exec docker-entrypoint.sh postgres -c shared_preload_libraries=pg_cron -c cron.database_name=cw'
          for _ in $(seq 1 90); do
            if [ "$(docker exec pgcron psql postgres://postgres:pw@127.0.0.1:5432/cw -tAc 'show shared_preload_libraries' 2>/dev/null)" = "pg_cron" ]; then
              echo "CRONWATCH_TEST_PGCRON=postgres://postgres:pw@127.0.0.1:5433/cw" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs pgcron
          exit 1
      - run: bundle exec rake test
        working-directory: packages/ruby
        env:
          CRONWATCH_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/cw
      # Build the gem, install it into an empty GEM_HOME and use it from a
      # fresh process outside the bundle, as an app would (check:packages
      # does the same for the npm packages).
      - name: Build, install and require the gem
        working-directory: packages/ruby
        run: |
          dir="$(mktemp -d)"
          gem build cronwatch.gemspec --output "$dir/cronwatch.gem"
          unset BUNDLE_GEMFILE RUBYOPT
          export GEM_HOME="$dir/gems" GEM_PATH="$dir/gems"
          gem install --no-document "$dir/cronwatch.gem"
          cd "$dir"
          ruby -e '
            require "cronwatch"
            require "cronwatch/pg_cron"
            resend = Cronwatch::Alerts::Resend.new(api_key: "re_smoke", from: "alerts@example.com", to: "ops@example.com")
            source = Cronwatch::Sources::PgCron.new(Class.new { def query(_sql, _params) = [] }.new)
            cw = Cronwatch.new(store: Cronwatch::Stores::Memory.new, alerts: [resend], sources: [source], cron_secret: nil)
            job = cw.job("smoke", schedule: "*/5 * * * *", timezone: "UTC")
            abort "run returned the wrong value" unless job.run { |j| j.log("ok"); 42 } == 42
            run = cw.runs("smoke").first
            abort "no run recorded" unless run&.ok?
            puts "cronwatch #{Cronwatch::VERSION} from #{Gem.loaded_specs.fetch("cronwatch").full_gem_path}"
          '
      # @cronwatch/mcp's tools against the gem's Cronwatch::Web, served by
      # packages/ruby/test/web/server.rb under the bundle (webrick is in its
      # test group).
      - name: MCP server against Cronwatch::Web
        run: npm test --workspace packages/mcp
        env:
          CRONWATCH_TEST_RUBY: "1"
          CRONWATCH_RUBY: bundle exec ruby

  # The Python package's tests replay conformance/ and the dashboard fixture,
  # share a SQLite file with the built SDK and check the croner port against
  # croner, so the SDK is built (and the fixtures checked) first. Postgres
  # store tests run against the service. Each supported Django series (5.2
  # LTS, 6.0 and 6.1; 6.x needs Python 3.12 or newer) runs over the dev
  # group's Django with `uv run --with`.
  python:
    name: python (Python ${{ matrix.python }}, Django ${{ matrix.django }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { python: "3.11", django: "5.2" }
          - { python: "3.14", django: "5.2" }
          - { python: "3.14", django: "6.0" }
          - { python: "3.14", django: "6.1" }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: cw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      # The broker for cronwatch.celery's prefork worker test.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Builds the SDK, then fails if conformance/, the dashboard fixture
      # (packages/ruby/test/web/golden.json) or the icons are stale.
      - run: npm run check:conformance
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      # A second Postgres with pg_cron, for the pg_cron source's tests against
      # the real extension, as the Node and Ruby jobs start it.
      - name: Start Postgres with pg_cron
        if: matrix.python == '3.14' && matrix.django == '6.1'
        run: |
          docker run -d --name pgcron -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=cw -p 5433:5432 postgres:16 \
            bash -c 'apt-get update -qq && apt-get install -y -qq postgresql-16-cron > /dev/null && exec docker-entrypoint.sh postgres -c shared_preload_libraries=pg_cron -c cron.database_name=cw'
          for _ in $(seq 1 90); do
            if [ "$(docker exec pgcron psql postgres://postgres:pw@127.0.0.1:5432/cw -tAc 'show shared_preload_libraries' 2>/dev/null)" = "pg_cron" ]; then
              echo "CRONWATCH_TEST_PGCRON=postgres://postgres:pw@127.0.0.1:5433/cw" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs pgcron
          exit 1
      - run: uv run --python ${{ matrix.python }} --with "django~=${{ matrix.django }}.0" pytest
        working-directory: packages/python
        env:
          CRONWATCH_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/cw
          CRONWATCH_TEST_REDIS: redis://127.0.0.1:6379/0
      # @cronwatch/mcp's tools against cronwatch.web, served by
      # packages/python/tests/web_server.py through uv on this entry's Python.
      - name: MCP server against cronwatch.web
        run: npm test --workspace packages/mcp
        env:
          CRONWATCH_TEST_PYTHON: "1"
          UV_PYTHON: ${{ matrix.python }}
      # Build the wheel, install it into an empty virtualenv and use it from a
      # directory outside the project, as an app would.
      - name: Build, install and import the package
        working-directory: packages/python
        run: |
          dir="$(mktemp -d)"
          uv build --out-dir "$dir/dist"
          uv venv --python ${{ matrix.python }} "$dir/venv"
          VIRTUAL_ENV="$dir/venv" uv pip install "$dir"/dist/*.whl "django~=${{ matrix.django }}.0" "celery>=5.5" "apscheduler>=3.10,<4"
          cd "$dir"
          "$dir/venv/bin/python" -c '
          import asyncio
          import cronwatch
          import cronwatch.apscheduler, cronwatch.celery
          from cronwatch.aio import AsyncCronwatch
          from cronwatch.web import Request
          from cronwatch.alerts import Resend
          from cronwatch.sources.pgcron import PgCron
          from cronwatch.stores import SqliteStore
          import cronwatch.django.urls, cronwatch.django.management.commands.cronwatch_check
          class NoCron:
              def query(self, sql, params):
                  return []
          resend = Resend(api_key="re_smoke", from_="alerts@example.com", to="ops@example.com")
          cw = cronwatch.Cronwatch(store=SqliteStore("smoke.db"), alerts=[resend], sources=[PgCron(NoCron())], cron_secret=None)
          job = cw.job("smoke", schedule="*/5 * * * *", timezone="UTC")
          assert job.run(lambda ctx: ctx.log("ok") or 42) == 42
          run = cw.runs("smoke")[0]
          assert run.ok and run.output == "ok", run
          web = cw.routes(token="smoke")
          seen = {}
          body = web({"REQUEST_METHOD": "GET", "PATH_INFO": "/api/jobs", "HTTP_AUTHORIZATION": "Bearer smoke"}, lambda status, headers: seen.update(status=status))
          assert seen["status"] == "200 OK" and b"\"name\":\"smoke\"" in b"".join(body), seen
          async def later(ctx):
              return "async ok"
          assert asyncio.run(job.run(later)) == "async ok"
          assert asyncio.run(AsyncCronwatch(cw).runs("smoke"))[0].output == "async ok"
          hook = job.handler(lambda ctx, request: "hooked", secret="smoke")
          answer = hook(Request("GET", "/cron", headers={"authorization": "Bearer smoke"}))
          assert answer.status == 200 and cw.runs("smoke")[0].output == "hooked", answer
          print("cronwatch", cronwatch.__version__, "from", cronwatch.__file__)
          '

  # The PHP package's tests replay conformance/ and the dashboard fixture,
  # share a SQLite file with the built SDK and check the croner port against
  # croner, so the SDK is built (and the fixtures checked) first. The MySQL, MariaDB and Postgres store
  # tests, and the finish-once tests with several processes, run against the
  # services; the pg_cron tests against a Postgres with the extension, as the
  # Node, Ruby and Python jobs start it. The Laravel and Symfony tests run on
  # the newest of each that the PHP allows (php-frameworks pins each series).
  php:
    name: php (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.5"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: cw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: cw
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw" --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: pw
          MARIADB_DATABASE: cw
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Builds the SDK, then fails if conformance/, the dashboard fixture
      # (packages/ruby/test/web/golden.json) or the icons are stale.
      - run: npm run check:conformance
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, curl, mysqli, zip
          coverage: none
          tools: composer:v2
      # No composer.lock is committed (a library's is ignored by the apps that
      # install it), so each PHP gets the newest dev dependencies it allows.
      - run: composer install --no-interaction --no-progress
        working-directory: packages/php
      # A second Postgres with pg_cron, for the pg_cron source's tests against
      # the real extension, as the Node, Ruby and Python jobs start it.
      - name: Start Postgres with pg_cron
        if: matrix.php == '8.5'
        run: |
          docker run -d --name pgcron -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=cw -p 5433:5432 postgres:16 \
            bash -c 'apt-get update -qq && apt-get install -y -qq postgresql-16-cron > /dev/null && exec docker-entrypoint.sh postgres -c shared_preload_libraries=pg_cron -c cron.database_name=cw'
          for _ in $(seq 1 90); do
            if [ "$(docker exec pgcron psql postgres://postgres:pw@127.0.0.1:5432/cw -tAc 'show shared_preload_libraries' 2>/dev/null)" = "pg_cron" ]; then
              echo "CRONWATCH_TEST_PGCRON=postgres://postgres:pw@127.0.0.1:5433/cw" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs pgcron
          exit 1
      # WP-CLI, pinned and checked, for the WordPress plugin's tests: they
      # install WordPress into a temporary directory (WP-CLI checks the
      # download's checksum against api.wordpress.org), install the built
      # plugin zip, and drive it through wp-cli and wp-cron.php. PHP 8.2 runs
      # them on WordPress 6.1, the plugin's floor; 8.5 on the default, current one.
      - name: Download WP-CLI
        run: |
          curl -sSLo "$RUNNER_TEMP/wp-cli.phar" https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo "be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832  $RUNNER_TEMP/wp-cli.phar" | sha512sum -c -
      - run: vendor/bin/phpunit
        working-directory: packages/php
        env:
          CRONWATCH_TEST_MYSQL: mysql://root:pw@127.0.0.1:3306/cw
          CRONWATCH_TEST_MARIADB: mysql://root:pw@127.0.0.1:3307/cw
          CRONWATCH_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/cw
          CRONWATCH_TEST_WORDPRESS: mysql://root:pw@127.0.0.1:3306/cw
          CRONWATCH_TEST_WPCLI: ${{ runner.temp }}/wp-cli.phar
          CRONWATCH_TEST_WP_VERSION: ${{ matrix.php == '8.2' && '6.1.14' || '' }}
      # @cronwatch/mcp's tools against the PHP dashboard's serve(), under
      # PHP's built-in server with packages/php/tests/servers/web.php.
      - name: MCP server against Cronwatch\Web\Dashboard
        run: npm test --workspace packages/mcp
        env:
          CRONWATCH_TEST_PHP: "1"
      # The plugin directory's zip: the plugin and the library, no dev files.
      - name: Build the WordPress plugin zip
        working-directory: packages/php
        run: php wordpress/build.php "$RUNNER_TEMP/plugin" && unzip -l "$RUNNER_TEMP"/plugin/cronwatch-*.zip | tail -1
      # Install the package from its directory into an empty project and use
      # it from there, as an app would.
      - name: Install and use the package
        run: |
          dir="$(mktemp -d)"
          cd "$dir"
          composer init --no-interaction --name smoke/smoke --stability dev
          composer config repositories.cronwatch "{\"type\": \"path\", \"url\": \"$GITHUB_WORKSPACE/packages/php\", \"options\": {\"symlink\": false}}"
          composer require --no-interaction --no-progress "cronwatch/cronwatch:*"
          cat > cronwatch.php <<'PHP'
          <?php
          require __DIR__ . "/vendor/autoload.php";
          $resend = new Cronwatch\Alerts\Resend(apiKey: "re_smoke", from: "alerts@example.com", to: "ops@example.com");
          $source = new Cronwatch\Sources\PgCron(new class { public function query(string $sql, array $params): array { return []; } });
          $cw = new Cronwatch\Cronwatch(store: new Cronwatch\Store\SqliteStore(__DIR__ . "/smoke.db"), alerts: [$resend], sources: [$source], cronSecret: false);
          $cw->job("smoke", ["schedule" => "*/5 * * * *", "timezone" => "UTC"]);
          return $cw;
          PHP
          php -r '
          $cw = require "cronwatch.php";
          $job = $cw->job("smoke", ["schedule" => "*/5 * * * *", "timezone" => "UTC"]);
          if ($job->run(function ($j) { $j->log("ok"); return 42; }) !== 42) { fwrite(STDERR, "run returned the wrong value\n"); exit(1); }
          $run = $cw->runs("smoke")[0];
          if (!$run->isOk() || $run->output !== "ok") { fwrite(STDERR, "no run recorded\n"); exit(1); }
          $answer = $cw->routes(token: "smoke")->handle(Cronwatch\Web\Request::create("GET", "/cronwatch/api/jobs", ["authorization" => "Bearer smoke"]));
          if ($answer->status !== 200 || !str_contains($answer->body, "\"name\":\"smoke\"")) { fwrite(STDERR, "the dashboard did not answer\n"); exit(1); }
          echo "cronwatch ", Cronwatch\Cronwatch::VERSION, " from ", (new ReflectionClass(Cronwatch\Cronwatch::class))->getFileName(), "\n";
          '
          # The Composer bin finds cronwatch.php in the working directory.
          test "$(vendor/bin/cronwatch check)" = "cronwatch: checked 1 job, sent 0 alerts"

  # The Laravel and Symfony integrations against each supported release,
  # one framework at a time: the php job above already runs them on the
  # newest each PHP allows (Laravel 12 and Symfony 7.4 on 8.2, Laravel 13
  # and Symfony 8.1 on 8.5); here each series is pinned on its own, the
  # other framework taken out, and its tests run (Orchestra Testbench for
  # Laravel, FrameworkBundle's test kernel for Symfony). Laravel 11 and
  # Symfony 7.3 and 8.0 are out of support and not tested.
  php-frameworks:
    name: php (PHP ${{ matrix.php }}, ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { php: "8.2", name: "Laravel 12", tests: tests/Laravel, remove: "symfony/browser-kit symfony/framework-bundle symfony/messenger symfony/scheduler symfony/security-bundle", require: "orchestra/testbench:^10.0" }
          - { php: "8.5", name: "Laravel 13", tests: tests/Laravel, remove: "symfony/browser-kit symfony/framework-bundle symfony/messenger symfony/scheduler symfony/security-bundle", require: "orchestra/testbench:^11.0" }
          - { php: "8.2", name: "Symfony 6.4", tests: tests/Symfony, remove: "orchestra/testbench", require: "symfony/browser-kit:6.4.* symfony/console:6.4.* symfony/framework-bundle:6.4.* symfony/messenger:6.4.* symfony/scheduler:6.4.* symfony/security-bundle:6.4.*" }
          - { php: "8.2", name: "Symfony 7.4", tests: tests/Symfony, remove: "orchestra/testbench", require: "symfony/browser-kit:7.4.* symfony/console:7.4.* symfony/framework-bundle:7.4.* symfony/messenger:7.4.* symfony/scheduler:7.4.* symfony/security-bundle:7.4.*" }
          - { php: "8.5", name: "Symfony 8.1", tests: tests/Symfony, remove: "orchestra/testbench", require: "symfony/browser-kit:8.1.* symfony/console:8.1.* symfony/framework-bundle:8.1.* symfony/messenger:8.1.* symfony/scheduler:8.1.* symfony/security-bundle:8.1.*" }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: cw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: cw
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw" --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: pw
          MARIADB_DATABASE: cw
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, curl
          coverage: none
          tools: composer:v2
      - name: Pin ${{ matrix.name }}
        working-directory: packages/php
        env:
          REMOVE: ${{ matrix.remove }}
          REQUIRE: ${{ matrix.require }}
        run: |
          # shellcheck disable=SC2086
          composer remove --dev --no-update --no-interaction $REMOVE
          # shellcheck disable=SC2086
          composer require --dev --no-update --no-interaction $REQUIRE
          composer update --no-interaction --no-progress
          composer show | grep -E '^(laravel/framework|orchestra/testbench|symfony/framework-bundle|symfony/scheduler|phpunit/phpunit) '
      - run: vendor/bin/phpunit ${{ matrix.tests }}
        working-directory: packages/php
        env:
          CRONWATCH_TEST_MYSQL: mysql://root:pw@127.0.0.1:3306/cw
          CRONWATCH_TEST_MARIADB: mysql://root:pw@127.0.0.1:3307/cw
          CRONWATCH_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/cw

  # The Drupal module in a real Drupal: tests/Drupal/DrupalTest.php makes a
  # Drupal project with Composer (drupal/core-recommended, Drush, and the
  # library and the module from this checkout as path repositories),
  # installs a site with Drush, and drives it with Drush (cron, queue:run,
  # cronwatch:check, uninstalling) and PHP's built-in server (/cron/<key>,
  # Automated Cron, the dashboard and settings behind the permissions, the
  # JSON API). Drupal 10.6 on PHP 8.2, the module's floor; 11 on 8.3, its
  # floor, and on 8.5; one entry per database driver the store reads.
  php-drupal:
    name: php (PHP ${{ matrix.php }}, Drupal ${{ matrix.drupal }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { php: "8.2", drupal: "10.6", constraint: "~10.6.0", db: mysql, url: "mysql://root:pw@127.0.0.1:3306/cw" }
          - { php: "8.3", drupal: "11", constraint: "^11.4", db: sqlite, url: "sqlite" }
          - { php: "8.5", drupal: "11", constraint: "^11.4", db: postgres, url: "postgres://postgres:pw@127.0.0.1:5432/cw" }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: cw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: cw
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, gd, curl, mbstring, xml, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
        working-directory: packages/php
      - run: vendor/bin/phpunit tests/Drupal
        working-directory: packages/php
        env:
          CRONWATCH_TEST_DRUPAL: ${{ matrix.constraint }}
          CRONWATCH_TEST_DRUPAL_DB: ${{ matrix.url }}

  # The Craft plugin in a real Craft: tests/Craft/CraftTest.php makes a Craft
  # project with Composer (craftcms/cms, and the library and the plugin from
  # this checkout), runs `craft install`, installs the plugin, and drives it
  # with console commands (the watched commands, queue/run, cronwatch/check,
  # uninstalling) and PHP's built-in server (the Control Panel's dashboard
  # behind its sign-in, CSRF and permissions, the JSON API). Craft 5.3, the
  # plugin's floor, and the newest 5.x, on PHP 8.2 and 8.5, on each database
  # Craft runs on.
  php-craft:
    name: php (PHP ${{ matrix.php }}, Craft ${{ matrix.craft }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { php: "8.2", craft: "5.3", constraint: "~5.3.0", db: mariadb, url: "mysql://root:pw@127.0.0.1:3307/cw" }
          - { php: "8.2", craft: "5", constraint: "^5.3", db: mysql, url: "mysql://root:pw@127.0.0.1:3306/cw" }
          - { php: "8.5", craft: "5", constraint: "^5.3", db: postgres, url: "postgres://postgres:pw@127.0.0.1:5432/cw" }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: cw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: cw
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw" --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: pw
          MARIADB_DATABASE: cw
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_pgsql, bcmath, curl, gd, intl, mbstring, xml, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
        working-directory: packages/php
      - run: vendor/bin/phpunit tests/Craft
        working-directory: packages/php
        env:
          CRONWATCH_TEST_CRAFT: ${{ matrix.constraint }}
          CRONWATCH_TEST_CRAFT_DB: ${{ matrix.url }}

  # The Go module on the two Go releases Go supports, with the race
  # detector. The core (packages/go, standard library only) replays
  # conformance/ and checks its croner port against croner through the built
  # SDK; packages/go/sqltest, a module of its own and the only place database
  # drivers appear, runs the SQL store's contract, conformance and
  # finish-once tests on SQLite, Postgres, MySQL and MariaDB, shares a
  # SQLite file with the SDK, and (on the newest Go) runs the pg_cron
  # source against a Postgres with the extension.
  go:
    name: go (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.25", "1.26"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: cw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: cw
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw" --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: pw
          MARIADB_DATABASE: cw
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
      # Asynq's broker, for cronwatch.dev/go/asynq's end-to-end test.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Builds the SDK (for the croner parity and Node compatibility tests),
      # then fails if conformance/ or the dashboard fixture is stale.
      - run: npm run check:conformance
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          # The core module has no go.sum: it requires nothing.
          cache-dependency-path: packages/go/*/go.sum
      - name: The core module requires nothing
        working-directory: packages/go
        run: |
          go mod tidy -diff
          test -z "$(go list -m -f '{{if not .Main}}{{.Path}}{{end}}' all)"
      # The modules nested in packages/go: the SQL tests and the examples
      # (never tagged), and the scheduler integrations, each requiring its
      # scheduler at the oldest release it supports.
      - name: The nested modules are tidy
        run: |
          for module in sqltest examples robfigcron gocron river asynq; do
            (cd "packages/go/$module" && go mod tidy -diff) || exit 1
          done
      - name: gofmt
        run: test -z "$(gofmt -l packages/go)" || { gofmt -l packages/go; exit 1; }
      - name: go vet
        run: |
          for module in . sqltest examples robfigcron gocron river asynq; do
            (cd "packages/go/$module" && go vet ./...) || exit 1
          done
      # staticcheck 0.8 needs Go 1.26 to build, so it lints on the newest entry;
      # the tests still run on both.
      - name: staticcheck
        if: matrix.go == '1.26'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          for module in . sqltest examples robfigcron gocron river asynq; do
            (cd "packages/go/$module" && "$(go env GOPATH)/bin/staticcheck" ./...) || exit 1
          done
      # A second Postgres with pg_cron, for the pg_cron source's tests against
      # the real extension, as the Node, Ruby, Python and PHP jobs start it.
      - name: Start Postgres with pg_cron
        if: matrix.go == '1.26'
        run: |
          docker run -d --name pgcron -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=cw -p 5433:5432 postgres:16 \
            bash -c 'apt-get update -qq && apt-get install -y -qq postgresql-16-cron > /dev/null && exec docker-entrypoint.sh postgres -c shared_preload_libraries=pg_cron -c cron.database_name=cw'
          for _ in $(seq 1 90); do
            if [ "$(docker exec pgcron psql postgres://postgres:pw@127.0.0.1:5432/cw -tAc 'show shared_preload_libraries' 2>/dev/null)" = "pg_cron" ]; then
              echo "CRONWATCH_TEST_PGCRON=postgres://postgres:pw@127.0.0.1:5433/cw" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs pgcron
          exit 1
      - run: go test -race -count=1 ./...
        working-directory: packages/go
      - run: go test -race -count=1 ./...
        working-directory: packages/go/sqltest
        env:
          CRONWATCH_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/cw
          CRONWATCH_TEST_MYSQL: mysql://root:pw@127.0.0.1:3306/cw
          CRONWATCH_TEST_MARIADB: mysql://root:pw@127.0.0.1:3307/cw
      # The integrations at the releases their go.mod requires (the oldest
      # supported: gocron 2.21.0, River 0.44.1, Asynq 0.25.1, robfig/cron
      # 3.0.1), River against Postgres and Asynq against Redis, and the
      # crontab example.
      - name: The integrations and the examples
        env:
          CRONWATCH_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/cw
          CRONWATCH_TEST_REDIS: redis://127.0.0.1:6379/0
        run: |
          for module in robfigcron gocron river asynq examples; do
            (cd "packages/go/$module" && go test -race -count=1 ./...) || exit 1
          done
      # And at the newest releases: River 0.45 and newer need Go 1.26, so
      # they run on that entry only. The go.mod changes stay in this job.
      - name: The integrations at their newest releases
        env:
          CRONWATCH_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/cw
          CRONWATCH_TEST_REDIS: redis://127.0.0.1:6379/0
        run: |
          (cd packages/go/gocron && go get github.com/go-co-op/gocron/v2@v2.22.0 && go test -race -count=1 ./...) || exit 1
          (cd packages/go/asynq && go get github.com/hibiken/asynq@v0.26.0 && go test -race -count=1 ./...) || exit 1
          if [ "${{ matrix.go }}" = "1.26" ]; then
            (cd packages/go/river && go get github.com/riverqueue/river@v0.47.0 github.com/riverqueue/river/riverdriver/riverpgxv5@v0.47.0 github.com/riverqueue/river/rivertype@v0.47.0 && go test -race -count=1 ./...) || exit 1
          fi
      # @cronwatch/mcp's tools against the Go dashboard, served by
      # packages/go/internal/webserver through `go run` on this entry's Go.
      - name: MCP server against the Go dashboard
        run: npm test --workspace packages/mcp
        env:
          CRONWATCH_TEST_GO: "1"

  rust:
    name: rust (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The core's rust-version, and the current stable. cronwatch-sqlx
        # needs 1.94 (sqlx 0.9), so it is linted and tested on stable only.
        rust: ["1.85", "stable"]
    # The databases for cronwatch-sqlx's server tests, as the go job has them.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: cw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: cw
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw" --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: pw
          MARIADB_DATABASE: cw
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Builds the SDK (for the croner parity and Node compatibility tests),
      # then fails if conformance/ or the dashboard fixture is stale.
      - run: npm run check:conformance
      # A second Postgres with pg_cron, for the pg_cron source's tests against
      # the real extension, as the other jobs start it. cronwatch-sqlx is
      # tested on stable only.
      - name: Start Postgres with pg_cron
        if: matrix.rust == 'stable'
        run: |
          docker run -d --name pgcron -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=cw -p 5433:5432 postgres:16 \
            bash -c 'apt-get update -qq && apt-get install -y -qq postgresql-16-cron > /dev/null && exec docker-entrypoint.sh postgres -c shared_preload_libraries=pg_cron -c cron.database_name=cw'
          for _ in $(seq 1 90); do
            if [ "$(docker exec pgcron psql postgres://postgres:pw@127.0.0.1:5432/cw -tAc 'show shared_preload_libraries' 2>/dev/null)" = "pg_cron" ]; then
              echo "CRONWATCH_TEST_PGCRON=postgres://postgres:pw@127.0.0.1:5433/cw" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs pgcron
          exit 1
      # rustup is on the runner, so no third-party action is needed.
      - name: Install Rust ${{ matrix.rust }}
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.rust }}
      - name: cargo fmt
        if: matrix.rust == 'stable'
        working-directory: packages/rust
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: packages/rust
        run: |
          if [ "${{ matrix.rust }}" = "stable" ]; then
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          else
            cargo clippy -p cronwatch --all-targets --all-features -- -D warnings
          fi
      # The workspace's .cargo/config.toml sets TZ=UTC, as the fixtures are made.
      - name: cargo test
        working-directory: packages/rust
        env:
          CRONWATCH_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/cw
          CRONWATCH_TEST_MYSQL: mysql://root:pw@127.0.0.1:3306/cw
          CRONWATCH_TEST_MARIADB: mysql://root:pw@127.0.0.1:3307/cw
        run: |
          if [ "${{ matrix.rust }}" = "stable" ]; then
            cargo test --workspace --all-features
          else
            cargo test -p cronwatch --all-features
          fi
      # @cronwatch/mcp's tools against the Rust dashboard, served by
      # packages/rust/webserver (axum) through `cargo run` on this entry's Rust.
      - name: MCP server against the Rust dashboard
        run: npm test --workspace packages/mcp
        env:
          CRONWATCH_TEST_RUST: "1"
