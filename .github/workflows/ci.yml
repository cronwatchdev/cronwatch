# Every push and pull request: the dash check (files and commit messages),
# typecheck, tests, a build, and the packed packages used from a scratch
# project, on the two Node majors better-sqlite3 13 supports. The Ruby gem's
# tests run on the oldest and newest Ruby it supports, against each
# supported Rails series. The Python package's tests run on the oldest and
# newest Python it supports, against each supported Django series. One Node,
# one Ruby and one Python entry also
# run the pg_cron tests against a Postgres with the extension, and the built
# site's links are checked.
# A green run on main is what lets deploy.yml ship the site.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: No em or en dashes in commit messages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            node scripts/check-dashes.mjs --commits "$BASE..$HEAD"
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # A new branch (before is all zeros) or a force push: the head commit only.
            node scripts/check-dashes.mjs --commits -1 "$AFTER"
          else
            node scripts/check-dashes.mjs --commits "$BEFORE..$AFTER"
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: cw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:dashes
      - run: npm run typecheck
      # A second Postgres with pg_cron, for the pg_cron source's tests against
      # the real extension. The stock image has the PGDG apt repository, so
      # the extension is installed before the server starts. The entrypoint's
      # setup server only listens on its socket, so a TCP query that sees
      # pg_cron preloaded means the real server is up (pg_isready would pass
      # during setup). The URL goes to $GITHUB_ENV for the steps after this.
      - name: Start Postgres with pg_cron
        if: matrix.node == 24
        run: |
          docker run -d --name pgcron -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=cw -p 5433:5432 postgres:16 \
            bash -c 'apt-get update -qq && apt-get install -y -qq postgresql-16-cron > /dev/null && exec docker-entrypoint.sh postgres -c shared_preload_libraries=pg_cron -c cron.database_name=cw'
          for _ in $(seq 1 90); do
            if [ "$(docker exec pgcron psql postgres://postgres:pw@127.0.0.1:5432/cw -tAc 'show shared_preload_libraries' 2>/dev/null)" = "pg_cron" ]; then
              echo "CRONWATCH_TEST_PGCRON=postgres://postgres:pw@127.0.0.1:5433/cw" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs pgcron
          exit 1
      - run: npm test
        env:
          CRONWATCH_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/cw
      - run: npm run build
      # Pack both packages, install the tarballs into a scratch project, then
      # import and require every entry, typecheck them (node16 ESM and CJS,
      # bundler) and run Are the Types Wrong.
      - run: npm run check:packages
      # Every internal link and #fragment in the built site resolves.
      - run: npm run build:site
      - run: node scripts/check-links.mjs site/dist

  # The gem's tests replay conformance/ and compare against the built SDK, so
  # the SDK is built (and the fixtures checked) first. Postgres store tests run against the service.
  # Each supported Rails series runs from its own Gemfile in
  # test/rails/gemfiles; setup-ruby's bundler-cache reads BUNDLE_GEMFILE
  # from the job's environment.
  ruby:
    name: ruby (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { ruby: "3.2", rails: "7.2", gemfile: rails_7_2 }
          - { ruby: "3.4", rails: "8.0", gemfile: rails_8_0 }
          - { ruby: "3.4", rails: "8.1", gemfile: rails_8_1 }
          - { ruby: "4.0", rails: "8.1", gemfile: rails_8_1 }
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/packages/ruby/test/rails/gemfiles/${{ matrix.gemfile }}.gemfile
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: cw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Builds the SDK, then fails if conformance/ or the dashboard fixture
      # (packages/ruby/test/web/golden.json) is stale.
      - run: npm run check:conformance
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: packages/ruby
      # A second Postgres with pg_cron, for the pg_cron source's tests against
      # the real extension. The stock image has the PGDG apt repository, so
      # the extension is installed before the server starts. The entrypoint's
      # setup server only listens on its socket, so a TCP query that sees
      # pg_cron preloaded means the real server is up (pg_isready would pass
      # during setup). The URL goes to $GITHUB_ENV for the steps after this.
      - name: Start Postgres with pg_cron
        if: matrix.ruby == '3.4' && matrix.rails == '8.1'
        run: |
          docker run -d --name pgcron -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=cw -p 5433:5432 postgres:16 \
            bash -c 'apt-get update -qq && apt-get install -y -qq postgresql-16-cron > /dev/null && exec docker-entrypoint.sh postgres -c shared_preload_libraries=pg_cron -c cron.database_name=cw'
          for _ in $(seq 1 90); do
            if [ "$(docker exec pgcron psql postgres://postgres:pw@127.0.0.1:5432/cw -tAc 'show shared_preload_libraries' 2>/dev/null)" = "pg_cron" ]; then
              echo "CRONWATCH_TEST_PGCRON=postgres://postgres:pw@127.0.0.1:5433/cw" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs pgcron
          exit 1
      - run: bundle exec rake test
        working-directory: packages/ruby
        env:
          CRONWATCH_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/cw
      # Build the gem, install it into an empty GEM_HOME and use it from a
      # fresh process outside the bundle, as an app would (check:packages
      # does the same for the npm packages).
      - name: Build, install and require the gem
        working-directory: packages/ruby
        run: |
          dir="$(mktemp -d)"
          gem build cronwatch.gemspec --output "$dir/cronwatch.gem"
          unset BUNDLE_GEMFILE RUBYOPT
          export GEM_HOME="$dir/gems" GEM_PATH="$dir/gems"
          gem install --no-document "$dir/cronwatch.gem"
          cd "$dir"
          ruby -e '
            require "cronwatch"
            require "cronwatch/pg_cron"
            resend = Cronwatch::Alerts::Resend.new(api_key: "re_smoke", from: "alerts@example.com", to: "ops@example.com")
            source = Cronwatch::Sources::PgCron.new(Class.new { def query(_sql, _params) = [] }.new)
            cw = Cronwatch.new(store: Cronwatch::Stores::Memory.new, alerts: [resend], sources: [source], cron_secret: nil)
            job = cw.job("smoke", schedule: "*/5 * * * *", timezone: "UTC")
            abort "run returned the wrong value" unless job.run { |j| j.log("ok"); 42 } == 42
            run = cw.runs("smoke").first
            abort "no run recorded" unless run&.ok?
            puts "cronwatch #{Cronwatch::VERSION} from #{Gem.loaded_specs.fetch("cronwatch").full_gem_path}"
          '
      # @cronwatch/mcp's tools against the gem's Cronwatch::Web, served by
      # packages/ruby/test/web/server.rb under the bundle (webrick is in its
      # test group).
      - name: MCP server against Cronwatch::Web
        run: npm test --workspace packages/mcp
        env:
          CRONWATCH_TEST_RUBY: "1"
          CRONWATCH_RUBY: bundle exec ruby

  # The Python package's tests replay conformance/ and the dashboard fixture,
  # share a SQLite file with the built SDK and check the croner port against
  # croner, so the SDK is built (and the fixtures checked) first. Postgres
  # store tests run against the service. Each supported Django series (5.2
  # LTS, 6.0 and 6.1; 6.x needs Python 3.12 or newer) runs over the dev
  # group's Django with `uv run --with`.
  python:
    name: python (Python ${{ matrix.python }}, Django ${{ matrix.django }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { python: "3.11", django: "5.2" }
          - { python: "3.14", django: "5.2" }
          - { python: "3.14", django: "6.0" }
          - { python: "3.14", django: "6.1" }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: cw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Builds the SDK, then fails if conformance/, the dashboard fixture
      # (packages/ruby/test/web/golden.json) or the icons are stale.
      - run: npm run check:conformance
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      # A second Postgres with pg_cron, for the pg_cron source's tests against
      # the real extension, as the Node and Ruby jobs start it.
      - name: Start Postgres with pg_cron
        if: matrix.python == '3.14' && matrix.django == '6.1'
        run: |
          docker run -d --name pgcron -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=cw -p 5433:5432 postgres:16 \
            bash -c 'apt-get update -qq && apt-get install -y -qq postgresql-16-cron > /dev/null && exec docker-entrypoint.sh postgres -c shared_preload_libraries=pg_cron -c cron.database_name=cw'
          for _ in $(seq 1 90); do
            if [ "$(docker exec pgcron psql postgres://postgres:pw@127.0.0.1:5432/cw -tAc 'show shared_preload_libraries' 2>/dev/null)" = "pg_cron" ]; then
              echo "CRONWATCH_TEST_PGCRON=postgres://postgres:pw@127.0.0.1:5433/cw" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs pgcron
          exit 1
      - run: uv run --python ${{ matrix.python }} --with "django~=${{ matrix.django }}.0" pytest
        working-directory: packages/python
        env:
          CRONWATCH_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/cw
      # @cronwatch/mcp's tools against cronwatch.web, served by
      # packages/python/tests/web_server.py through uv on this entry's Python.
      - name: MCP server against cronwatch.web
        run: npm test --workspace packages/mcp
        env:
          CRONWATCH_TEST_PYTHON: "1"
          UV_PYTHON: ${{ matrix.python }}
      # Build the wheel, install it into an empty virtualenv and use it from a
      # directory outside the project, as an app would.
      - name: Build, install and import the package
        working-directory: packages/python
        run: |
          dir="$(mktemp -d)"
          uv build --out-dir "$dir/dist"
          uv venv --python ${{ matrix.python }} "$dir/venv"
          VIRTUAL_ENV="$dir/venv" uv pip install "$dir"/dist/*.whl "django~=${{ matrix.django }}.0"
          cd "$dir"
          "$dir/venv/bin/python" -c '
          import cronwatch
          from cronwatch.alerts import Resend
          from cronwatch.sources.pgcron import PgCron
          from cronwatch.stores import SqliteStore
          import cronwatch.django.urls, cronwatch.django.management.commands.cronwatch_check
          class NoCron:
              def query(self, sql, params):
                  return []
          resend = Resend(api_key="re_smoke", from_="alerts@example.com", to="ops@example.com")
          cw = cronwatch.Cronwatch(store=SqliteStore("smoke.db"), alerts=[resend], sources=[PgCron(NoCron())], cron_secret=None)
          job = cw.job("smoke", schedule="*/5 * * * *", timezone="UTC")
          assert job.run(lambda ctx: ctx.log("ok") or 42) == 42
          run = cw.runs("smoke")[0]
          assert run.ok and run.output == "ok", run
          web = cw.routes(token="smoke")
          seen = {}
          body = web({"REQUEST_METHOD": "GET", "PATH_INFO": "/api/jobs", "HTTP_AUTHORIZATION": "Bearer smoke"}, lambda status, headers: seen.update(status=status))
          assert seen["status"] == "200 OK" and b'"name":"smoke"' in b"".join(body), seen
          print("cronwatch", cronwatch.__version__, "from", cronwatch.__file__)
          '
