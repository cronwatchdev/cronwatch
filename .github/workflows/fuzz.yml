# Once a week, and by hand: each cargo-fuzz target in packages/rust/fuzz
# runs for a minute on nightly, off the path of a push (CI only builds
# them). A failure prints the input that found it on libFuzzer's "Base64:"
# line; saved to a file, `cargo +nightly fuzz run <target> <file>` in
# packages/rust/fuzz replays it. The Java port's seeded properties run
# alongside, longer than CI runs them.
name: Fuzz

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [json, duration, cron, jsre, request, rows]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz ${{ matrix.target }} for a minute
        working-directory: packages/rust/fuzz
        env:
          TARGET: ${{ matrix.target }}
        # jsre runs each pattern within its step budget (see DESIGN.md), so
        # a slow input fails it as it fails every other target.
        run: cargo +nightly fuzz run "$TARGET" -- -max_total_time=60 -timeout=10

  # The Java port's properties (seeded JUnit tests over its Gen, one per door
  # untrusted input comes through) at a thousand times their tries. A failure
  # names the seed of the case that failed.
  java:
    name: fuzz (java properties)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "27"
      - name: The properties, a thousand times over
        working-directory: packages/java
        run: >-
          ./mvnw -B verify -pl cronwatch
          -Dtest='*Properties' -Dsurefire.failIfNoSpecifiedTests=false
          -Dcronwatch.tries=1000
