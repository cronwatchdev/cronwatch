cronwatch.settings:
  type: config_object
  label: 'CronWatch settings'
  mapping:
    email_to:
      type: string
      label: 'Email alerts to'
    slack_webhook_url:
      type: string
      label: 'Slack incoming webhook URL'
    webhook_url:
      type: string
      label: 'Webhook URL'
    webhook_secret:
      type: string
      label: 'Webhook signing secret'
    grace:
      type: string
      label: 'Grace'
    schedule:
      type: string
      label: 'Cron schedule'
    check_on_cron:
      type: boolean
      label: 'Run the check at the end of each cron run'
    queues:
      type: sequence
      label: 'Watched queue workers'
      sequence:
        type: string
        label: 'Queue worker plugin ID'
