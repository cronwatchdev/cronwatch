administer cronwatch:
  title: 'Administer CronWatch'
  description: 'Choose where alerts go and which queues are watched, and silence, forget, or check jobs from the dashboard. The site sends requests to the addresses set here, internal ones included, and "Send a test alert" shows what each answered: give it only to roles trusted with the server''s network.'
  restrict access: true
view cronwatch dashboard:
  title: 'View the CronWatch dashboard'
  description: 'See the watched jobs, their runs, and their output, which holds what each job logged.'
  restrict access: true
