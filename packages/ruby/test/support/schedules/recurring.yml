# A Solid Queue config/recurring.yml shaped like a real app's: a shared
# block merged into each environment, Fugit phrases and a cron line,
# classes with arguments, and a command.
default: &default
  sync_feeds:
    class: SyncFeedsJob
    queue: background
    schedule: every hour at minute 12
  daily_digest:
    class: DailyDigestJob
    args: [ { kind: "daily" } ]
    schedule: every day at 10am
    description: "The morning digest"
  refresh_scores:
    class: RefreshScoresJob
    schedule: every 5 minutes
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every day at 3am
  nightly_backup:
    class: NightlyBackupJob
    schedule: "0 2 * * *"
  cronwatch_check:
    class: Cronwatch::CheckJob
    schedule: every 5 minutes

production:
  <<: *default

test:
  <<: *default

development:
  sync_feeds:
    class: SyncFeedsJob
    schedule: every 30 minutes
  not_a_task:
    class: NightlyBackupJob
