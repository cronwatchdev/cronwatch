[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cronwatch-sdk"
version = "0.5.0"
description = "Cron and scheduled-job monitoring that lives inside your app."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Jon C. Phillips" }]
keywords = ["cron", "monitoring", "scheduled jobs", "alerts", "heartbeat", "celery", "django"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
# The core has no dependencies: cron parsing is a port of croner, and zones come from zoneinfo.
dependencies = []

[project.optional-dependencies]
# zoneinfo reads the system's zone database; Windows has none, so install this there.
tzdata = ["tzdata"]
# cronwatch.stores.postgres and the pg_cron source's psycopg connections. 3.2 brought RawCursor ($1 placeholders).
postgres = ["psycopg>=3.2"]
# cronwatch.triage.anthropic.
anthropic = ["anthropic>=0.40"]
# cronwatch.django: the settings, the dashboard's URLs and the cronwatch_check command.
django = ["django>=5.2"]

[project.urls]
Homepage = "https://cronwatch.dev"
Documentation = "https://cronwatch.dev/docs/"
Source = "https://github.com/phillips-jon/cronwatch/tree/main/packages/python"
Issues = "https://github.com/phillips-jon/cronwatch/issues"

[dependency-groups]
# psycopg for the Postgres and pg_cron tests (run when CRONWATCH_TEST_PG or
# CRONWATCH_TEST_PGCRON is set), anthropic to check triage requests against the
# real SDK, Django for the Django integration (CI runs each supported series
# with `uv run --with "django~=X.Y.0"`).
dev = ["pytest>=8", "psycopg[binary]>=3.2", "anthropic>=0.40", "django>=5.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/cronwatch"]

[tool.hatch.build.targets.sdist]
include = ["src/cronwatch", "README.md", "LICENSE", "DESIGN.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
