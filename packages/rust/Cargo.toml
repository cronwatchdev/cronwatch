[workspace]
resolver = "3"
members = ["cronwatch", "cronwatch-sqlx", "cronwatch-tokio-cron-scheduler", "cronwatch-apalis", "webserver", "examples/crontab"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Jon Phillips"]
repository = "https://github.com/phillips-jon/cronwatch"
homepage = "https://cronwatch.dev"
keywords = ["cron", "monitoring", "scheduler", "alerts", "jobs"]
categories = ["development-tools", "asynchronous"]

# The other crates require cronwatch at exactly the release's version, so a
# release's crates always come together. scripts/release.mjs bumps both the
# version above and the pin here.
[workspace.dependencies]
cronwatch = { path = "cronwatch", version = "=0.7.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
# cargo-fuzz builds with --cfg fuzzing, which opens cronwatch::fuzz to the
# targets in fuzz/.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
