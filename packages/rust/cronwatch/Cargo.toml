[package]
name = "cronwatch"
description = "Know when your cron jobs fail, run late or never run: the library behind cronwatch.dev, for Rust"
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*", "!src/conformance/**", "!src/**/tests.rs", "!src/**/*_tests.rs", "Cargo.toml", "README.md", "LICENSE"]

[features]
# A blocking client for programs with no runtime of their own.
blocking = ["tokio/net"]
# The store contract test, the store.json replay and the finish-once
# scenarios, for stores of the app's own.
storetest = []
# The alert channels (Slack, Discord, the webhook, the email providers,
# Twilio and the error trackers) and the default transport they post with.
alerts = ["__transport", "dep:hmac"]
# Claude triage over plain HTTP, on the same transport (not the channels).
triage = ["__transport"]
# The dashboard and a job's handler as tower services, for hyper, axum,
# tonic's HTTP stack and lambda_http.
tower = ["dep:http", "dep:http-body", "dep:http-body-util", "dep:bytes", "dep:tower-service"]
# tower, and the mount axum records when the dashboard is nested
# (NestedPath and OriginalUri); Routes::into_router(), deprecated.
axum = ["tower", "dep:axum"]
# What the channels and triage share: reqwest on rustls with the platform's
# roots, and the WHATWG URL parser fetch reads URLs with. Not for apps to
# name: turn on `alerts` or `triage`.
__transport = ["dep:reqwest", "dep:url", "dep:idna_adapter"]
# `JobOptions::expect_match` takes a `regex::Regex`.
regex = ["dep:regex"]
# Serialize and Deserialize on the public types, for the app's own use
# (the stores and channels never use them).
serde = ["dep:serde"]

[dependencies]
tokio = { version = "1.44", default-features = false, features = ["rt", "time", "sync"] }
getrandom = "0.3"
jiff = "0.2.15"
# The app tag's hash (bridge::app_tag), as the PHP and Go ports make it.
md-5 = "0.11"
reqwest = { version = "0.13.1", default-features = false, features = ["rustls", "gzip"], optional = true }
url = { version = "2.5.4", optional = true }
# Keeps url's IDNA on its unicode-rs backend (idna_adapter 1.1). The ICU4X
# backend (1.2) pulls in yoke-derive, whose newest release declares no
# rust-version and needs Rust 1.87, so the MSRV-aware resolver cannot keep a
# 1.85 build working with it; this backend is also some fifteen crates
# lighter.
idna_adapter = { version = "~1.1", optional = true }
# The dashboard's cookie, the alert ids and SigV4.
sha2 = "0.11"
hmac = { version = "0.13", optional = true }
http = { version = "1.1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1.2", optional = true }
bytes = { version = "1.7.1", optional = true }
tower-service = { version = "0.3.3", optional = true }
axum = { version = "0.8.4", default-features = false, features = ["original-uri"], optional = true }
# `JobOptions::expect_match` with a `regex::Regex` (the `regex` feature).
regex = { version = "1.10", default-features = false, features = ["std", "unicode"], optional = true }
# Serialize and Deserialize on the public types (the `serde` feature).
serde = { version = "1.0.219", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
tokio = { version = "1.44", features = ["full", "test-util"] }
flate2 = "1.0.35"
# The serde feature's round trip.
serde_json = "1"
# The dashboard's golden replay and the handler behind a real server.
axum = { version = "0.8.4", default-features = false, features = ["original-uri", "tokio", "http1"] }
hyper = { version = "1.6", features = ["client", "http1"] }
hyper-util = { version = "0.1.14", features = ["http1", "tokio"] }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
# The job's handler and the dashboard served on AWS Lambda.
lambda_http = { version = "1", default-features = false, features = ["apigw_http"] }
# A certificate made at run time and a TLS server, for the test that an
# untrusted certificate is refused. rcgen 0.14 needs Rust 1.88.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
# The Rust croner crate (tokio-cron-scheduler's parser), for the report of
# the croner fuzz generator against it: a report, not a gate.
croner = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"

[[test]]
name = "store"
required-features = ["storetest"]

[[test]]
name = "alerts"
required-features = ["alerts", "triage"]

[[test]]
name = "routes_golden"
required-features = ["axum"]

[[test]]
name = "routes"
required-features = ["axum"]

[[test]]
name = "lambda"
required-features = ["axum"]

[[test]]
name = "handler"
required-features = ["axum"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
