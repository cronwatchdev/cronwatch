[package]
name = "cronwatch"
description = "Know when your cron jobs fail, run late or never run: the library behind cronwatch.dev, for Rust"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[features]
# A blocking client for programs with no runtime of their own.
blocking = ["tokio/rt"]
# The store contract test, the store.json replay and the finish-once
# scenarios, for stores of the app's own.
storetest = []

[dependencies]
tokio = { version = "1.43", default-features = false, features = ["rt", "time", "sync", "macros"] }
getrandom = "0.3"
jiff = "0.2.15"

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "test-util"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
